<script src="assets/gsap.min.js"></script>
<script>
(function () {
  if (!window.__timelines) window.__timelines = {};

  function init() {
    var tl = gsap.timeline({ paused: true });
    window.__timelines["05-cta"] = tl;

    // --- Upper hairline setup ---
    var upperLine = document.getElementById("cta-upper-line");
    var lowerLine = document.getElementById("cta-lower-line");

    function setupPath(el) {
      var len = el.getTotalLength ? el.getTotalLength() : 972;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    }
    setupPath(upperLine);
    setupPath(lowerLine);

    // Scene 1 (0.0–1.2s): Topbar label fade in, upper hairline draw
    tl.fromTo(
      "#cta-topbar",
      { opacity: 0 },
      { opacity: 1, duration: 0.5, ease: "power3.out" },
      0.0
    );

    tl.to(
      upperLine,
      { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
      0.1
    );

    // Scene 2 (1.2–3.0s): "feed" "your" "roots" cascade
    tl.fromTo(
      "#cta-feed",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      1.2
    );
    tl.fromTo(
      "#cta-your",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      1.38
    );
    tl.fromTo(
      "#cta-roots",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      1.56
    );

    // Scene 3 (3.0–4.5s): ".us" spring-blooms in, lower hairline draws
    tl.fromTo(
      "#cta-tld",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
      3.0
    );

    tl.to(
      lowerLine,
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      3.5
    );

    // Scene 4 (4.5–6.0s): subtitle appears
    tl.fromTo(
      "#cta-subtitle",
      { opacity: 0 },
      { opacity: 1, duration: 0.4, ease: "power3.out" },
      4.5
    );

    // Scene 5 (6.0–7.0s): subtle jitter on wordmark row
    var phaseW = { p: 0 };
    var IDLE_DUR = 7.0 - 6.0;
    tl.to(phaseW, {
      p: Math.PI * 2 * 0.4,
      duration: IDLE_DUR,
      ease: "none",
      onUpdate: function () {
        var el = document.querySelector(".cta-wordmark-row");
        if (el) el.style.transform = "translateY(" + (Math.sin(phaseW.p) * 1) + "px)";
      }
    }, 6.0);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
