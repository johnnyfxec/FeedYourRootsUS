<!-- Lower hairline (cream) -->

  <svg id="pi-hairline-bottom-svg" viewBox="0 0 1080 2" preserveAspectRatio="none">
    <line id="pi-hairline-bottom-line" x1="0" y1="1" x2="1080" y2="1"/>
  </svg>

<script src="assets/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};

  function setupLine(el) {
    const len = el.getTotalLength();
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    return len;
  }

  // Setup SVG lines before timeline builds
  const topLine    = document.getElementById('pi-hairline-top-line');
  const bottomLine = document.getElementById('pi-hairline-bottom-line');
  setupLine(topLine);
  setupLine(bottomLine);

  const tl = gsap.timeline({ paused: true });

  // ── Scene 1 (0.0–1.2s) ──────────────────────────────────────────
  // Topbar fade in
  tl.fromTo('#pi-topbar',
    { opacity: 0 },
    { opacity: 1, duration: 0.5, ease: 'power3.out' },
    0.0
  );

  // Upper hairline draws left-to-right (start 0.4s, 0.6s draw)
  tl.to('#pi-hairline-top-line',
    { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' },
    0.4
  );

  // ── Scene 2 (1.2–3.2s) ──────────────────────────────────────────
  // "THE COMPLETE" label slides up and fades in
  tl.fromTo('#pi-label-complete',
    { y: 24, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' },
    1.2
  );

  // ── Scene 3 (3.2–5.5s) ──────────────────────────────────────────
  // "HOMESTEADING SYSTEM" slides up
  tl.fromTo('#pi-headline',
    { y: 40, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' },
    3.2
  );

  // "for suburban families" fades in 0.4s after headline start
  tl.fromTo('#pi-subhead',
    { opacity: 0 },
    { opacity: 1, duration: 0.5, ease: 'power3.out' },
    3.6
  );

  // Lower cream hairline draws left-to-right, 0.5s, starts at 4.0s
  tl.to('#pi-hairline-bottom-line',
    { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' },
    4.0
  );

  // ── Scene 4 (5.5–7.0s) ──────────────────────────────────────────
  // Subtle sine-wave jitter on headline (yoyo, low amplitude ±1px)
  const HOLD_START = 5.6;
  const PERIOD     = 2.5;
  const HOLD_DUR   = 7.0 - HOLD_START;
  const REPEATS    = Math.floor(HOLD_DUR / (PERIOD / 2)) - 1;

  tl.to('#pi-headline',
    { y: -1, duration: PERIOD / 2, ease: 'sine.inOut', yoyo: true, repeat: REPEATS },
    HOLD_START
  );

  window.__timelines['02-product-intro'] = tl;
})();
</script>
