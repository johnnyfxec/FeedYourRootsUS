<script src="assets/gsap.min.js"></script>
<script>
(function () {
  if (!window.__timelines) window.__timelines = {};

  const tl = gsap.timeline({ paused: true });
  window.__timelines["03-feature-showcase"] = tl;

  // --- Hairline path draw setup ---
  const hairline = document.getElementById('fs-hairline');
  const hairlineLen = hairline.getTotalLength();
  hairline.style.strokeDasharray = hairlineLen;
  hairline.style.strokeDashoffset = hairlineLen;

  // Scene 1 (0.0–1.8s): topbar appears, hairline draws
  tl.fromTo('#fs-topbar',
    { opacity: 0, y: -10 },
    { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
    0.0
  );

  tl.to(hairline, {
    strokeDashoffset: 0,
    duration: 0.8,
    ease: "power2.out"
  }, 0.2);

  // Scene 2 (1.8–4.2s): Tile 1 springs in
  tl.fromTo('#fs-tile1',
    { scale: 0, opacity: 0, y: 40 },
    { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
    1.8
  );

  // Scene 3 (4.2–6.6s): Tile 2 springs in
  tl.fromTo('#fs-tile2',
    { scale: 0, opacity: 0, y: 40 },
    { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
    4.2
  );

  // Scene 4 (6.6–8.5s): Tile 3 springs in
  tl.fromTo('#fs-tile3',
    { scale: 0, opacity: 0, y: 40 },
    { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
    6.6
  );

  // Scene 5 (8.5–9.0s): subtle jitter on all three tiles
  const tileSelectors = ['#fs-tile1', '#fs-tile2', '#fs-tile3'];
  const IDLE_START = 8.5;
  const IDLE_DUR = 0.5;

  tileSelectors.forEach(function (sel, i) {
    const phase = { p: 0 };
    tl.to(phase, {
      p: Math.PI * 2 * 0.2,
      duration: IDLE_DUR,
      ease: "none",
      onUpdate: function () {
        const el = document.querySelector(sel);
        if (el) el.style.transform = 'translateY(' + (Math.sin(phase.p + i * Math.PI / 2) * 1.5) + 'px)';
      }
    }, IDLE_START + i * 0.15);
  });

})();
