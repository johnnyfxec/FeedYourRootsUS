<script src="assets/gsap.min.js"></script>
<script>
(function () {
  if (!window.__timelines) window.__timelines = {};

  function setupPath(el) {
    const len = el.getTotalLength();
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    return len;
  }

  const topLine = document.getElementById('pr-hairline-top-line');
  const priceLine = document.getElementById('pr-hairline-price-line');

  setupPath(topLine);
  setupPath(priceLine);

  const tl = gsap.timeline({ paused: true });
  window.__timelines["04-pricing"] = tl;

  // Scene 1 (0.0–1.0s): Topbar fade in + upper hairline draw
  tl.fromTo(
    '#pr-topbar',
    { opacity: 0 },
    { opacity: 1, duration: 0.5, ease: 'power3.out' },
    0
  );

  tl.to(
    topLine,
    { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' },
    0.1
  );

  // Scene 2 (1.0–2.8s): "5 BUNDLES" slide up
  tl.fromTo(
    '#pr-bundles',
    { y: 20, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' },
    1.0
  );

  // Scene 3 (2.8–4.5s): "starting at" slide up
  tl.fromTo(
    '#pr-starting-at',
    { y: 16, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' },
    2.8
  );

  // Scene 4 (4.5–6.5s): pink hairline draws + "$37" slides up
  tl.to(
    priceLine,
    { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' },
    4.5
  );

  tl.fromTo(
    '#pr-price',
    { y: 28, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' },
    4.5
  );

  // Scene 5 (6.5–7.0s): subtle jitter on "$37"
  const phase37 = { p: 0 };
  tl.to(phase37, {
    p: Math.PI * 2 * 0.2,
    duration: 0.5,
    ease: 'none',
    onUpdate: function () {
      const el = document.getElementById('pr-price');
      if (el) el.style.transform = 'translateY(' + (Math.sin(phase37.p) * 1) + 'px)';
    }
  }, 6.5);
})();
