<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F5ECD7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="38"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-02-product-intro"
        class="scene"
        data-composition-id="02-product-intro"
        data-composition-src="compositions/frames/02-product-intro.html"
        data-start="8"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-03-feature-showcase"
        class="scene"
        data-composition-id="03-feature-showcase"
        data-composition-src="compositions/frames/03-feature-showcase.html"
        data-start="15"
        data-duration="9"
        data-track-index="1"
      ></div>

      <div
        id="el-04-pricing"
        class="scene"
        data-composition-id="04-pricing"
        data-composition-src="compositions/frames/04-pricing.html"
        data-start="24"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="31"
        data-duration="7"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
