<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FYR — Medidor de esquinas</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; background: #1a1a1a; color: #f5ecd7;
    font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh;
    display: flex; flex-direction: column; touch-action: none;
  }
  #toolbar {
    padding: 10px 12px; background: #0a0a0a; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; border-bottom: 2px solid #4a7c59;
    z-index: 10;
  }
  #toolbar input[type=file] { color: #f5ecd7; max-width: 160px; font-size: 12px; }
  button {
    background: #4a7c59; color: #f5ecd7; border: none; padding: 8px 12px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:active { background: #3a6247; }
  button.secondary { background: #5c3a1e; }
  button:disabled { background: #444; color: #888; }
  #status {
    font-size: 13px; font-weight: 600; color: #e8b84b; margin-left: auto;
  }
  #canvasWrap {
    flex: 1; position: relative; overflow: hidden; background: #111;
    background-image:
      linear-gradient(45deg, #1c1c1c 25%, transparent 25%),
      linear-gradient(-45deg, #1c1c1c 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1c1c1c 75%),
      linear-gradient(-45deg, transparent 75%, #1c1c1c 75%);
    background-size: 20px 20px;
  }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; }
  #results {
    background: #0a0a0a; padding: 12px; border-top: 2px solid #4a7c59;
    max-height: 30vh; overflow-y: auto; display: none;
  }
  #results.show { display: block; }
  #results pre {
    background: #1a1a1a; padding: 10px; border-radius: 6px; font-size: 12px;
    overflow-x: auto; color: #a8d5ba; margin: 8px 0;
  }
  #results h3 { margin: 0 0 8px 0; color: #e8b84b; font-size: 14px; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  #zoomInfo {
    position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7);
    padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #f5ecd7;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="toolbar">
  <input type="file" id="fileInput" accept="image/*">
  <button id="resetBtn">Reiniciar puntos</button>
  <button id="zoomInBtn" class="secondary">Zoom +</button>
  <button id="zoomOutBtn" class="secondary">Zoom -</button>
  <div id="status">Cargá una imagen</div>
</div>

<div id="canvasWrap">
  <canvas id="canvas"></canvas>
  <div id="zoomInfo">100%</div>
</div>

<div id="results">
  <h3>Resultado — 4 esquinas registradas</h3>
  <pre id="resultJson"></pre>
  <div class="hint">Coordenadas en píxeles reales de la imagen original (no de pantalla).</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const resultJsonEl = document.getElementById('resultJson');
const zoomInfoEl = document.getElementById('zoomInfo');

const LABELS = ['superior-izquierda', 'superior-derecha', 'inferior-derecha', 'inferior-izquierda'];
const POINT_COLORS = ['#e8b84b', '#d4732a', '#4a7c59', '#5c3a1e'];

let img = null;
let currentFileName = null;
let scale = 1;
let offsetX = 0, offsetY = 0;
let points = [];

// --- Pan/zoom state ---
let isPanning = false;
let panStart = { x: 0, y: 0 };
let panOffsetStart = { x: 0, y: 0 };
let pinchStartDist = null;
let pinchStartScale = 1;

function resizeCanvas() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}
window.addEventListener('resize', resizeCanvas);

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const image = new Image();
    image.onload = () => {
      img = image;
      points = [];
      resultsEl.classList.remove('show');
      fitToScreen();
      updateStatus();
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function fitToScreen() {
  if (!img) return;
  const scaleX = wrap.clientWidth / img.width;
  const scaleY = wrap.clientHeight / img.height;
  scale = Math.min(scaleX, scaleY) * 0.95;
  offsetX = (wrap.clientWidth - img.width * scale) / 2;
  offsetY = (wrap.clientHeight - img.height * scale) / 2;
  draw();
}

function draw() {
  if (!canvas.width) return;
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!img) return;

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  ctx.drawImage(img, 0, 0);
  ctx.restore();

  // Dibujar puntos ya registrados
  points.forEach((p, i) => {
    const sx = p.x * scale + offsetX;
    const sy = p.y * scale + offsetY;
    ctx.beginPath();
    ctx.arc(sx, sy, 8, 0, Math.PI * 2);
    ctx.fillStyle = POINT_COLORS[i];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(String(i + 1), sx + 12, sy - 12);
    ctx.fillText(String(i + 1), sx + 12, sy - 12);
  });

  // Dibujar el poligono si ya hay 2+ puntos
  if (points.length >= 2) {
    ctx.beginPath();
    points.forEach((p, i) => {
      const sx = p.x * scale + offsetX;
      const sy = p.y * scale + offsetY;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    if (points.length === 4) ctx.closePath();
    ctx.strokeStyle = '#e8b84b';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  zoomInfoEl.textContent = Math.round(scale * 100) + '%';
}

function screenToImageCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const sx = clientX - rect.left;
  const sy = clientY - rect.top;
  return {
    x: (sx - offsetX) / scale,
    y: (sy - offsetY) / scale,
  };
}

function updateStatus() {
  if (!img) { statusEl.textContent = 'Cargá una imagen'; return; }
  if (points.length < 4) {
    statusEl.textContent = `Toca la esquina: ${LABELS[points.length]} (${points.length}/4)`;
  } else {
    statusEl.textContent = '4 esquinas registradas ✓';
  }
}

function addPoint(clientX, clientY) {
  if (!img || points.length >= 4) return;
  const { x, y } = screenToImageCoords(clientX, clientY);
  points.push({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 });
  draw();
  updateStatus();
  if (points.length === 4) showResults();
}

function showResults() {
  const named = {};
  LABELS.forEach((label, i) => { named[label] = points[i]; });

  // Calcular ancho/alto real (promedio de lados opuestos) y centro
  const [tl, tr, br, bl] = points;
  const widthTop = Math.hypot(tr.x - tl.x, tr.y - tl.y);
  const widthBottom = Math.hypot(br.x - bl.x, br.y - bl.y);
  const heightLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
  const heightRight = Math.hypot(br.x - tr.x, br.y - tr.y);
  const centerX = (tl.x + tr.x + br.x + bl.x) / 4;
  const centerY = (tl.y + tr.y + br.y + bl.y) / 4;
  const angleTop = Math.atan2(tr.y - tl.y, tr.x - tl.x) * 180 / Math.PI;

  const summary = {
    archivo: currentFileName,
    dimensiones_imagen: { w: img.width, h: img.height },
    esquinas: named,
    ancho_promedio: Math.round(((widthTop + widthBottom) / 2) * 10) / 10,
    alto_promedio: Math.round(((heightLeft + heightRight) / 2) * 10) / 10,
    centro: { x: Math.round(centerX * 10) / 10, y: Math.round(centerY * 10) / 10 },
    angulo_grados: Math.round(angleTop * 100) / 100,
  };

  resultJsonEl.textContent = JSON.stringify(summary, null, 2);
  resultsEl.classList.add('show');
}

document.getElementById('resetBtn').addEventListener('click', () => {
  points = [];
  resultsEl.classList.remove('show');
  draw();
  updateStatus();
});

document.getElementById('zoomInBtn').addEventListener('click', () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1.4));
document.getElementById('zoomOutBtn').addEventListener('click', () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1/1.4));

function zoomAt(screenX, screenY, factor) {
  if (!img) return;
  const imgX = (screenX - offsetX) / scale;
  const imgY = (screenY - offsetY) / scale;
  scale *= factor;
  scale = Math.max(0.1, Math.min(scale, 30));
  offsetX = screenX - imgX * scale;
  offsetY = screenY - imgY * scale;
  draw();
}

// --- Touch/mouse: click simple = punto; drag = pan; pinch = zoom ---
let dragMoved = false;
let touchStartTime = 0;

canvas.addEventListener('pointerdown', (e) => {
  touchStartTime = Date.now();
  dragMoved = false;
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY };
  panOffsetStart = { x: offsetX, y: offsetY };
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (!isPanning) return;
  const dx = e.clientX - panStart.x;
  const dy = e.clientY - panStart.y;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
  if (dragMoved) {
    offsetX = panOffsetStart.x + dx;
    offsetY = panOffsetStart.y + dy;
    draw();
  }
});

canvas.addEventListener('pointerup', (e) => {
  isPanning = false;
  const elapsed = Date.now() - touchStartTime;
  if (!dragMoved && elapsed < 500) {
    addPoint(e.clientX, e.clientY);
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const rect = canvas.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, factor);
}, { passive: false });

// Pinch-to-zoom para mobile
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    isPanning = false;
    pinchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    pinchStartScale = scale;
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchStartDist) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = canvas.getBoundingClientRect();
    const factor = (dist / pinchStartDist) * (pinchStartScale / scale);
    zoomAt(midX - rect.left, midY - rect.top, factor);
  }
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pinchStartDist = null;
}, { passive: true });

resizeCanvas();
</script>

</body>
</html>
