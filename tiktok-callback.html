<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>TikTok Authorization — Feed Your Roots</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F5ECD7;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    h1 { font-size: 1.25rem; margin-top: 0; }
    .code-box {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      word-break: break-all;
      margin: 16px 0;
      user-select: all;
    }
    button {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    .error { color: #c0392b; }
    .hint { color: #555; font-size: 0.9rem; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Procesando autorización de TikTok…</h1>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const errorDesc = params.get("error_description");
    const card = document.getElementById("card");

    if (code) {
      card.innerHTML = `
        <h1>Autorizado ✅</h1>
        <p>Copia este código y pégalo en la terminal donde está esperando el script:</p>
        <div class="code-box" id="codeBox">${code}</div>
        <button id="copyBtn">Copiar código</button>
        <p class="hint">Este código expira en pocos minutos y es de un solo uso — pégalo en la terminal cuanto antes.</p>
      `;
      document.getElementById("copyBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(code).then(() => {
          document.getElementById("copyBtn").textContent = "¡Copiado!";
        });
      });
    } else if (error) {
      card.innerHTML = `
        <h1 class="error">Error de autorización</h1>
        <p><strong>${error}</strong></p>
        <p>${errorDesc || ""}</p>
        <p class="hint">Vuelve a la terminal e intenta de nuevo.</p>
      `;
    } else {
      card.innerHTML = `
        <h1 class="error">No se recibió ningún código</h1>
        <p class="hint">Esta página solo funciona como destino de la redirección de autorización de TikTok. Si llegaste aquí directamente, no hay nada que hacer.</p>
      `;
    }
  </script>
</body>
</html>
