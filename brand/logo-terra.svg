<?xml version="1.0"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="noise"></feTurbulence>
      <feComposite in="noise" in2="SourceGraphic" operator="in"></feComposite>
    </filter>
    <radialGradient id="glow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </radialGradient>
    <clipPath id="shape">
      <rect width="500" height="500" rx="80"></rect>
    </clipPath>
  </defs>
  
  <rect width="500" height="500" rx="80" fill="#D4732A"></rect>
  
  
  <rect width="500" height="500" rx="80" fill="url(#glow)"></rect>
  
  <rect width="500" height="500" rx="80" filter="url(#grain)" opacity="0.055"></rect>
  
  <g transform="translate(211, 148) scale(2.8)">
    
