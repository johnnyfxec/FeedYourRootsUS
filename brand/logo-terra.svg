  <path d="M14 14 C14 8, 7 6, 4 9 C7 9, 11 11, 14 14Z" fill="#F5ECD7" opacity="0.9"></path>
  <path d="M14 11 C14 5, 21 3, 24 6 C21 6, 17 8, 14 11Z" fill="#F5ECD7" opacity="0.9"></path>
  </g>
  
  <text x="250" y="315" text-anchor="middle" font-family="Satisfy, cursive" font-size="112" fill="#F5ECD7" letter-spacing="-1">FYR</text>
  
  <rect x="195" y="334" width="110" height="5" rx="2.5" fill="#F5ECD7" opacity="0.85"></rect>
